<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Копилка</title>
<style>
:root{--bg1:#e8eefc;--bg2:#fbeef4;--b1:rgba(10,132,255,.28);--b2:rgba(255,100,150,.22);--glass:rgba(255,255,255,.52);--edge:rgba(255,255,255,.75);--line:rgba(0,0,0,.08);--tx:#10141f;--mu:#6b7280;--ac:#0a84ff;--gr:#2fb866;--rd:#ff453a;--pill:rgba(10,132,255,.14);--sh:0 8px 30px rgba(20,30,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#080c18;--bg2:#17102a;--b1:rgba(10,132,255,.3);--b2:rgba(190,70,255,.22);--glass:rgba(38,42,60,.5);--edge:rgba(255,255,255,.16);--line:rgba(255,255,255,.1);--tx:#f2f4f8;--mu:#9aa3b2;--ac:#4aa3ff;--gr:#3ddc84;--pill:rgba(74,163,255,.2);--sh:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#080c18;--bg2:#17102a;--b1:rgba(10,132,255,.3);--b2:rgba(190,70,255,.22);--glass:rgba(38,42,60,.5);--edge:rgba(255,255,255,.16);--line:rgba(255,255,255,.1);--tx:#f2f4f8;--mu:#9aa3b2;--ac:#4aa3ff;--gr:#3ddc84;--pill:rgba(74,163,255,.2);--sh:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 8%,var(--b1),transparent 42%),radial-gradient(circle at 92% 78%,var(--b2),transparent 46%)}
#app{max-width:520px;margin:0 auto;padding:16px 16px 140px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.glass,.card{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--edge);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.25)}
.card{border-radius:26px;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;margin:8px 4px 16px}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em}
.rb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.rb svg{width:20px;height:20px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.stat .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--pill);color:var(--ac)}
.stat b{font-size:21px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero{display:flex;flex-direction:column;align-items:center;padding:22px 16px}
.ring{position:relative;width:200px;height:200px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:url(#g);transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:46px;letter-spacing:-.03em;font-weight:700}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--gr));transition:width .8s}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-size:18px}
.wd,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd span{font-size:12px;color:var(--mu);padding:4px 0}
.d{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;transition:background .2s}
.d:active{background:var(--pill)}
.d.today{box-shadow:inset 0 0 0 1.5px var(--ac);font-weight:700}
.d.sel{background:var(--pill)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%}
.e{background:var(--gr)}.p{background:var(--ac)}
.leg{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--mu)}
.leg span{display:flex;align-items:center;gap:6px}
.hc{margin-bottom:12px}
.hc .nm{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px}
.tm{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.tm small{font-size:15px;font-weight:500;color:var(--mu);letter-spacing:0}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;background:var(--pill);color:var(--ac)}
.chip.r{background:rgba(255,69,58,.14);color:var(--rd)}
.hist{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.hist div{display:flex;justify-content:space-between;padding:4px 0;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:4px;padding:6px;border-radius:999px;z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 20px;border-radius:999px;color:var(--mu);font-size:11px;font-weight:600;transition:all .25s}
.tabs button.on{background:var(--pill);color:var(--ac)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
#ov.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:86vh;overflow:auto;transform:translate(-50%,105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);z-index:9;border-radius:30px 30px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
#sheet.open{transform:translate(-50%,0)}
#sheet:not(.open){visibility:hidden;transition:transform .38s cubic-bezier(.2,.9,.25,1),visibility 0s .38s}
#sheet h2{font-size:21px;margin-bottom:4px;text-transform:capitalize}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 14px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:16px;outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.seg{display:flex;padding:3px;border-radius:14px;background:var(--line);margin-top:12px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--glass);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cta{width:100%;margin-top:18px;padding:14px;border-radius:16px;background:var(--ac);color:#fff;font-weight:700}
.ev{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev .t{flex:1}.ev .t small{display:block;color:var(--mu)}
.ev button{font-size:13px;color:var(--ac);padding:4px 6px}
.ev button.x{color:var(--rd)}
.err{color:var(--rd);font-size:13px;min-height:18px;margin-top:8px}
.pre{display:flex;align-items:center;width:100%;padding:13px 16px;margin-top:8px;border-radius:16px;border:1px solid var(--line);background:var(--glass);font-size:16px;text-align:left}
.pre:active{background:var(--pill)}
.chip.sel{background:var(--ac);color:#fff}
.by{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 3px);font-size:10px;line-height:1;letter-spacing:.08em;color:var(--mu);opacity:.85;pointer-events:none;z-index:4}
.tabs{align-items:center}
.tabs button.big{padding:12px 28px;font-size:12px}
.tabs button.big svg{width:28px;height:28px}
label{font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div id="view"></div></div>
<div class="by">by nebuday</div>
<nav class="tabs glass" id="tabs"></nav>
<div id="ov" onclick="closeS()"></div>
<div id="sheet" class="glass"></div>
<script>
var IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',fire:'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z',wal:'M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-3v3M16 13h3',tg:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',fl:'M5 21V4h11l-2 4 2 4H5',pl:'M12 5v14M5 12h14',l:'M15 5l-7 7 7 7',r:'M9 5l7 7-7 7'};
function ic(n){return '<svg class="i" viewBox="0 0 24 24"><path d="'+IC[n]+'"/></svg>'}
var S=load(),tab='home',cm=new Date(),sel=null,T='earn',editId=null,openH={};
cm.setDate(1);
function load(){var d={goal:100000,base:0,cur:'₽',events:[],habits:[],theme:null,plan:{freq:'day',months:3,end:''}};try{var s=JSON.parse(localStorage.getItem('fin26'));if(s)for(var k in s)d[k]=s[k]}catch(e){}return d}
function save(){try{localStorage.setItem('fin26',JSON.stringify(S))}catch(e){}}
function applyTheme(){if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme}
function toggleTheme(){var dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dark?'light':'dark';applyTheme();save()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function p2(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function money(n){return Math.round(n).toLocaleString('ru-RU')+' '+esc(S.cur)}
function pl(n,a){n=Math.abs(n)%100;var m=n%10;return n>10&&n<20?a[2]:m>1&&m<5?a[1]:m==1?a[0]:a[2]}
function el(h){return (h.end||Date.now())-h.start}
function parts(ms){ms=Math.max(ms,0);return{d:Math.floor(ms/864e5),h:Math.floor(ms%864e5/36e5),m:Math.floor(ms%36e5/6e4)}}
function dur(ms){var t=parts(ms);return t.d+' д '+t.h+' ч '+t.m+' мин'}
function go(t){tab=t;render()}
function totals(){var today=ymd(new Date());var dep=S.events.filter(function(e){return e.type==='dep'&&e.date<=today}).reduce(function(a,e){return a+e.amount},0);var saved=S.base+dep;return{saved:saved,left:Math.max(S.goal-saved,0),p:S.goal>0?Math.min(saved/S.goal,1):0}}
function head(t,btn,sub){return '<div class="top"><div><h1>'+t+'</h1><div class="mu">'+(sub||'')+'</div></div><div style="display:flex;gap:8px">'+(btn||'')+'<button class="rb glass" aria-label="Тема" onclick="toggleTheme()">◐</button></div></div>'}
function home(){var t=totals(),C=2*Math.PI*86,pc=Math.round(t.p*100);
var best=S.habits.slice().sort(function(a,b){return el(b)-el(a)})[0];var bd=best?parts(el(best)).d:0;
setTimeout(function(){var f=document.querySelector('.fg');if(f)f.style.strokeDashoffset=C*(1-t.p)},60);
function st(i,l,v,fn){return '<button class="card stat" onclick="'+fn+'"><span class="ic">'+ic(i)+'</span><span class="mu">'+l+'</span><b>'+v+'</b></button>'}
return head('Главная','','Ваш прогресс к цели')+'<div class="card hero"><div class="ring"><svg width="200" height="200" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--gr)"/></linearGradient></defs><circle class="bg" cx="100" cy="100" r="86"/><circle class="fg" cx="100" cy="100" r="86" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg><div class="c"><b>'+pc+'%</b><span class="mu">до цели</span></div></div></div>'
+'<div class="grid">'+st('wal','Уже накоплено',money(t.saved),'goalSheet()')+st('fl','Осталось накопить',money(t.left),'goalSheet()')+st('tg','Цель накопления',money(S.goal),'goalSheet()')+st('fire',best?esc(best.name):'Привычка',best?bd+' '+pl(bd,['день','дня','дней']):'Добавить','go(\'habits\')')+'</div>'}
function cal(){var y=cm.getFullYear(),m=cm.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),today=ymd(new Date());
var lab=new Intl.DateTimeFormat('ru',{month:'long',year:'numeric'}).format(cm);lab=lab[0].toUpperCase()+lab.slice(1);
var c='',ea=0,de=0;for(var i=0;i<first;i++)c+='<span></span>';
for(var d=1;d<=n;d++){var k=y+'-'+p2(m+1)+'-'+p2(d),ev=S.events.filter(function(e){return e.date===k}),h=ev.some(function(e){return e.type==='earn'}),q=ev.some(function(e){return e.type==='dep'});
ev.forEach(function(e){if(e.type==='earn')ea+=e.amount;else de+=e.amount});
c+='<button class="d'+(k===today?' today':'')+(k===sel?' sel':'')+'" onclick="dateSheet(\''+k+'\')">'+d+'<span class="dots">'+(h?'<i class="dot e"></i>':'')+(q?'<i class="dot p"></i>':'')+'</span></button>'}
return head('Календарь','','Нажмите на дату, чтобы добавить запись')+'<div class="card"><div class="cal-h"><button class="rb" onclick="mon(-1)" aria-label="Назад">'+ic('l')+'</button><b>'+lab+'</b><button class="rb" onclick="mon(1)" aria-label="Вперёд">'+ic('r')+'</button></div><div class="wd">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(function(x){return '<span>'+x+'</span>'}).join('')+'</div><div class="days">'+c+'</div><div class="leg"><span><i class="dot e"></i>Заработок</span><span><i class="dot p"></i>Взнос</span></div></div>'
+'<div class="grid"><div class="card stat"><span class="mu">Заработок за месяц</span><b>'+money(ea)+'</b></div><div class="card stat"><span class="mu">Взносы за месяц</span><b>'+money(de)+'</b></div></div>'+planner()}
function mon(d){cm.setMonth(cm.getMonth()+d);render()}
function planEnd(){var p=S.plan,t=new Date();t.setHours(0,0,0,0);if(p.end)return new Date(p.end+'T00:00');var e=new Date(t);e.setMonth(e.getMonth()+p.months);return e}
function planInfo(){var t=new Date();t.setHours(0,0,0,0);var td=ymd(t),e=planEnd(),days=Math.round((e-t)/864e5)+1,dep=S.events.filter(function(x){return x.type==='dep'&&x.date<=td&&!(x.auto&&x.date>=td)}).reduce(function(a,x){return a+x.amount},0),left=Math.max(S.goal-S.base-dep,0),n=Math.max(S.plan.freq==='alt'?Math.ceil(days/2):days,0);return{e:e,n:n,left:left,amt:n>0?Math.ceil(left/n):0}}
function planner(){var p=S.plan,i=planInfo(),ml=new Intl.DateTimeFormat('ru',{day:'numeric',month:'long',year:'numeric'}).format(i.e);
var chips=[1,3,6,12].map(function(m){return '<button class="chip'+(!p.end&&p.months===m?' sel':'')+'" onclick="setEnd('+m+')">'+(m===12?'1 год':m+' '+pl(m,['месяц','месяца','месяцев']))+'</button>'}).join('');
return '<div class="card" style="margin-top:12px"><b style="font-size:18px">План накопления</b><p class="mu" style="margin-top:4px">Выберите цель, частоту и дату, а приложение посчитает взнос.</p><label>1. Цель накопления</label>'+goalChips()+'<label>2. Как часто вносить</label><div class="seg"><button class="'+(p.freq==='day'?'on':'')+'" onclick="setFreq(\'day\')">Каждый день</button><button class="'+(p.freq==='alt'?'on':'')+'" onclick="setFreq(\'alt\')">Через день</button></div><label>3. До какой даты</label><div class="acts" style="margin-top:0">'+chips+'</div><input type="date" value="'+ymd(i.e)+'" min="'+ymd(new Date())+'" onchange="setEndDate(this.value)" style="margin-top:10px">'+(i.left<=0?'<p class="empty">Цель уже достигнута.</p>':i.n<1?'<p class="err">Выберите дату в будущем.</p>':'<div class="mu" style="margin-top:14px">Минимальный взнос</div><div class="tm" style="margin:2px 0 4px">'+money(i.amt)+'</div><div class="mu">'+(p.freq==='alt'?'каждый второй день':'каждый день')+' до '+ml+' · взносов: '+i.n+'</div><button class="cta" onclick="applyPlan()">Запланировать в календаре</button>')+'</div>'}
function goalChips(){return '<div class="acts" style="margin-top:0">'+[50000,100000,250000,500000,1000000].map(function(v){return '<button class="chip'+(S.goal===v?' sel':'')+'" onclick="setGoal('+v+')">'+v.toLocaleString('ru-RU')+'</button>'}).join('')+'<button class="chip" onclick="goalSheet()">Своя сумма</button></div>'}
function setGoal(v){S.goal=v;save();render()}
function setFreq(f){S.plan.freq=f;save();render()}
function setEnd(m){S.plan.months=m;S.plan.end='';save();render()}
function setEndDate(v){if(v){S.plan.end=v;save();render()}}
function applyPlan(){var i=planInfo();if(i.n<1||i.left<=0)return;var d=new Date();d.setHours(0,0,0,0);var td=ymd(d),st=S.plan.freq==='alt'?2:1;S.events=S.events.filter(function(e){return !(e.auto&&e.date>=td)});for(var k=0;k<i.n&&k<800;k++){var x=new Date(d);x.setDate(d.getDate()+k*st);S.events.push({id:Date.now()+k,date:ymd(x),type:'dep',amount:i.amt,note:'План накопления',auto:true})}save();render()}
var MS=[1,3,7,14,30,60,90,180,365,730,1095];
function habits(){var h=S.habits.map(function(x){var ms=el(x),dd=ms/864e5,nx=MS.find(function(v){return v>dd})||Math.ceil(dd+1),pv=MS.filter(function(v){return v<=dd}).pop()||0,pr=Math.min((dd-pv)/(nx-pv),1)*100,t=parts(ms);
var hist=(x.history||[]).slice().reverse().map(function(r){return '<div><span>'+new Date(r.start).toLocaleDateString('ru-RU')+' — '+new Date(r.end).toLocaleDateString('ru-RU')+'</span><b>'+dur(r.end-r.start)+'</b></div>'}).join('')||'<div>Пока нет прошлых попыток</div>';
var rec=Math.max.apply(null,[ms].concat((x.history||[]).map(function(r){return r.end-r.start})));
return '<div class="card hc"><div class="nm"><span>'+esc(x.name)+'</span><span class="mu">'+(x.end?'остановлено':'идёт')+'</span></div><div class="tm" data-id="'+x.id+'">'+t.d+' <small>д</small> '+t.h+' <small>ч</small> '+t.m+' <small>мин</small></div><div class="bar"><i style="width:'+pr+'%"></i></div><div class="mu" style="margin-top:6px">Следующая отметка: '+nx+' '+pl(nx,['день','дня','дней'])+' · рекорд '+parts(rec).d+' д</div><div class="acts"><button class="chip r" onclick="askReset('+x.id+')">Сбросить</button><button class="chip" onclick="stopH('+x.id+')">'+(x.end?'Возобновить':'Остановить')+'</button><button class="chip" onclick="tg('+x.id+')">История</button><button class="chip" style="background:none;color:var(--mu)" onclick="askDel('+x.id+')">Удалить</button></div>'+(openH[x.id]?'<div class="hist">'+hist+'</div>':'')+'</div>'}).join('');
return head('Привычки','<button class="rb glass" aria-label="Добавить" onclick="habitSheet()">'+ic('pl')+'</button>','Считайте дни без вредных привычек')+(h||'<div class="card empty">Добавьте первую привычку, например «Без сахара», и счётчик пойдёт сразу.</div>')}
function render(){var v=$('#view');v.innerHTML=tab==='home'?home():tab==='cal'?cal():habits();
$('#tabs').innerHTML=[['cal','Календарь','cal'],['home','Главная','home'],['habits','Привычки','fire']].map(function(t){return '<button class="'+(tab===t[0]?'on':'')+(t[0]==='home'?' big':'')+'" onclick="go(\''+t[0]+'\')">'+ic(t[2])+t[1]+'</button>'}).join('')}
function $(s){return document.querySelector(s)}
function openS(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#sheet').classList.add('open');$('#ov').classList.add('open')}
function closeS(){$('#sheet').classList.remove('open');$('#ov').classList.remove('open');sel=null;if(tab==='cal')render()}
function goalSheet(){openS('<h2>Цель накопления</h2><label>Цель</label><input id="g1" type="number" inputmode="decimal" value="'+S.goal+'"><label>Накоплено до взносов из календаря</label><input id="g2" type="number" inputmode="decimal" value="'+S.base+'"><label>Валюта</label><input id="g3" maxlength="4" value="'+esc(S.cur)+'"><button class="cta" onclick="saveGoal()">Сохранить</button>')}
function saveGoal(){S.goal=Math.max(+$('#g1').value||0,0);S.base=+$('#g2').value||0;S.cur=$('#g3').value.trim()||'₽';save();closeS();render()}
function dateSheet(k,id){sel=k;editId=id||null;var e=S.events.find(function(x){return x.id===id});T=e?e.type:T;
var list=S.events.filter(function(x){return x.date===k}).map(function(x){return '<div class="ev"><i class="dot '+(x.type==='earn'?'e':'p')+'"></i><div class="t"><b>'+(x.type==='earn'?'Заработок ':'Взнос ')+money(x.amount)+'</b>'+(x.note?'<small>'+esc(x.note)+'</small>':'')+'</div><button onclick="dateSheet(\''+k+'\','+x.id+')">Изменить</button><button class="x" onclick="delEv('+x.id+')">Удалить</button></div>'}).join('');
var dt=new Intl.DateTimeFormat('ru',{weekday:'long',day:'numeric',month:'long'}).format(new Date(k+'T00:00'));
openS('<h2>'+dt+'</h2><div>'+(list||'<p class="mu" style="margin-top:6px">На этот день ничего не запланировано.</p>')+'</div><div class="seg"><button data-t="earn" class="'+(T==='earn'?'on':'')+'" onclick="setT(\'earn\')">Заработок</button><button data-t="dep" class="'+(T==='dep'?'on':'')+'" onclick="setT(\'dep\')">Взнос</button></div><label>Сумма</label><input id="a" type="number" inputmode="decimal" placeholder="0" value="'+(e?e.amount:'')+'"><label>Заметка</label><input id="n" placeholder="Необязательно" value="'+(e?esc(e.note||''):'')+'"><div class="err" id="er"></div><button class="cta" style="margin-top:6px" onclick="saveEv()">'+(e?'Сохранить изменения':'Добавить')+'</button>');
if(tab==='cal')render()}
function setT(t){T=t;document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)})}
function saveEv(){var a=+$('#a').value;if(!(a>0)){$('#er').textContent='Введите сумму больше нуля.';return}var n=$('#n').value.trim();
if(editId){var e=S.events.find(function(x){return x.id===editId});e.type=T;e.amount=a;e.note=n}else S.events.push({id:Date.now(),date:sel,type:T,amount:a,note:n});
save();dateSheet(sel)}
function delEv(id){S.events=S.events.filter(function(x){return x.id!==id});save();dateSheet(sel)}
var PR=['🍬 Без сахара','🔞 Без контента 18+','🚬 Без никотина','🍺 Без алкоголя','📱 Без бесцельного скроллинга','🍟 Без фастфуда','🎰 Без азартных игр','☕ Без лишнего кофеина'];
function habitSheet(){var have=S.habits.map(function(h){return h.name});openS('<h2>Новая привычка</h2><p class="mu">Выберите вариант, и отсчёт начнётся сегодня, прямо сейчас.</p>'+PR.map(function(n,i){return have.indexOf(n)<0?'<button class="pre" onclick="addH('+i+')">'+n+'</button>':''}).join('')+'<label>Свой вариант</label><input id="hn" placeholder="Название привычки"><div class="err" id="er"></div><button class="cta" style="margin-top:6px" onclick="addH(-1)">Начать отсчёт</button>')}
function addH(i){var n=i>=0?PR[i]:$('#hn').value.trim();if(!n){$('#er').textContent='Введите название привычки.';return}S.habits.push({id:Date.now(),name:n,start:Date.now(),history:[]});save();closeS();render()}
function H(id){return S.habits.find(function(x){return x.id===id})}
function ask(t,l,fn){openS('<h2>'+t+'</h2><p class="mu">Это действие нельзя отменить.</p><button class="cta" style="background:var(--rd)" onclick="'+fn+'">'+l+'</button><button class="cta" style="background:var(--pill);color:var(--ac)" onclick="closeS()">Отмена</button>')}
function askReset(id){ask('Сбросить счётчик?','Сбросить и начать заново','doReset('+id+')')}
function doReset(id){var h=H(id),now=Date.now();h.history=h.history||[];h.history.push({start:h.start,end:h.end||now});h.start=now;delete h.end;save();closeS();render()}
function askDel(id){ask('Удалить привычку?','Удалить','doDel('+id+')')}
function doDel(id){S.habits=S.habits.filter(function(x){return x.id!==id});save();closeS();render()}
function stopH(id){var h=H(id);if(h.end){h.start+=Date.now()-h.end;delete h.end}else h.end=Date.now();save();render()}
function tg(id){openH[id]=!openH[id];render()}
applyTheme();render();
setInterval(function(){if(tab==='habits'&&!$('#sheet').classList.contains('open'))render()},30000);
</script>
</body>
</html>
