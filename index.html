:root[data-theme="pink"]{--bg:#FFEAF3;--sf:#fff;--tx:#3A1328;--mu:#9A6B82;--ln:#F6CADD;--in:#0E9F7E;--ex:#D92D4F;--ac:#E0457B;--acb:#FFD6E6;--g1:#FF9EC7;--g2:#E1B3FF;--g3:#FFC9A8;--gl:rgba(255,255,255,.42);--gs:rgba(255,238,246,.8);--gb:rgba(255,255,255,.8);--sh:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),0 10px 30px rgba(224,69,123,.18);--sheen:rgba(255,255,255,.65);color-scheme:light}

</style></head><body>
<main id="app"></main>

<script>
const $=s=>document.querySelector(s),G=id=>document.getElementById(id).value;
const def=()=>({name:'',cur:'₽',tx:[],sav:[],hab:[],goals:[]});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem('disc')||'{}'))}catch(e){S=def()}
const save=()=>{try{localStorage.setItem('disc',JSON.stringify(S))}catch(e){}};
let tab='home',per='month';
const p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>iso(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(n).toLocaleString('ru-RU')+' '+S.cur,uid=()=>Date.now()+Math.floor(Math.random()*999);
const CI=['Зарплата','Подработка','Бизнес','Подарки','Другое'],CE=['Еда','Транспорт и бензин','Развлечения','Покупки','Одежда','Подписки','Долги и кредиты','Другое'];
const EI={'Зарплата':'💼','Подработка':'🛠️','Бизнес':'🏢','Подарки':'🎁','Другое':'✨','Еда':'🍽️','Транспорт и бензин':'⛽','Развлечения':'🎬','Покупки':'🛍️','Одежда':'👕','Подписки':'🔁','Долги и кредиты':'🏦'};
const PRE={'Здоровье':[['Без сахара','🍬'],['Без никотина','🚭'],['Без алкоголя','🍷'],['Без энергетиков','⚡'],['Без фастфуда','🍔'],['Без переедания','🥗']],
'Цифровая дисциплина':[['Без контента 18+','🔞'],['Без бесцельного скроллинга','📱'],['Без социальных сетей','💬'],['Без игр','🎮']],
'Саморазвитие':[['Ежедневное чтение','📖'],['Спорт каждый день','🏃'],['Ранний подъём','⏰'],['Регулярное обучение','🎓'],['Ежедневная прогулка','🚶']]};
const MED=[[1,'Первый шаг','🌱'],[3,'Начало пути','🧭'],[7,'Первая неделя','🥉'],[14,'Две недели силы','💪'],[30,'Железная дисциплина','🛡️'],[60,'Серьёзное достижение','🥈'],[90,'Новый уровень','🚀'],[180,'Полгода дисциплины','💎'],[365,'Год победы','👑']];
const PH=['Один день за раз.','Маленький шаг лучше, чем никакого.','Дисциплина — это свобода.','Ты сильнее, чем импульс.','Сегодня ты строишь себя завтрашнего.','Не идеально, а регулярно.','Каждый день — новая попытка.','Привычки решают всё.','Начни сейчас, не завтра.','Прогресс важнее скорости.','Ты уже дальше, чем вчера.','Терпение — тоже сила.','Хочется — не значит нужно.','Победа начинается с «нет».','Сделай, пока не передумал.','Деньги любят счёт.','Копейка к копейке — и цель ближе.','Береги время и деньги.','Цель без шагов — просто мечта.','Выбирай долгую выгоду.','Сила воли — как мышца.','Помни, зачем начал.','Ещё один день в копилку.','Ты хозяин своих решений.','Усталость пройдёт, результат останется.','Лучшее время начать — сейчас.','Тяжело сегодня — легче завтра.','Не сравнивай себя с другими, только с собой вчерашним.','Серия растёт, пока ты держишься.','Тихая работа даёт громкий результат.','Трудности — это тренировка.','Сомневаешься — сделай первый шаг.','Ты можешь больше, чем думаешь.','Дисциплина сильнее мотивации.','Держи курс.','Горжись каждым днём.','Свобода — это контроль над собой.','Сегодня лучше, чем вчера.','Хорошие дни складываются в хорошую жизнь.','Верь в процесс.'],RL=['Срыв — это не конец, а урок.','Упал — встань и иди дальше.','Рекорд сохранён. Начни новую серию.','Главное — не сдаваться.','Один срыв не отменяет всего пути.','Сделай выводы и продолжай.','Ты уже доказал, что можешь.','Новый день — новая попытка.'];
let phi=Math.floor(Date.now()/864e5)%PH.length;
function nextPh(){phi=(phi+1+Math.floor(Math.random()*(PH.length-1)))%PH.length;const e=$('#phT');if(e)e.textContent=PH[phi]}
const GC=['Финансы','Здоровье','Спорт','Работа','Образование','Личная жизнь','Саморазвитие'],GS=['активная','выполнена','отложена'];

/* ---- расчёты ---- */
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
function pstart(p){const d=new Date();if(p==='week')d.setDate(d.getDate()-(d.getDay()+6)%7);else if(p==='month')d.setDate(1);else if(p==='year')d.setMonth(0,1);return iso(d)}
function inP(t,p){const s=pstart(p);if(p==='day')return t.date===s;if(p==='week'){const e=new Date(s+'T00:00');e.setDate(e.getDate()+7);return t.date>=s&&t.date<iso(e)}return p==='month'?t.date.slice(0,7)===s.slice(0,7):t.date.slice(0,4)===s.slice(0,4)}
const el=h=>Math.max(0,(h.done?h.endAt:h.paused?h.pausedAt:Date.now())-h.start),bestMs=h=>Math.max(h.best||0,el(h)),dd=ms=>Math.floor(ms/864e5);
const pct=g=>g.steps.length?Math.round(g.steps.filter(s=>s.d).length/g.steps.length*100):(g.status==='выполнена'?100:0);
const maxDays=()=>Math.max(S.rec||0,...S.hab.map(h=>dd(bestMs(h)))),earned=()=>MED.filter(m=>maxDays()>=m[0]);
function xp(){return S.hab.reduce((s,h)=>s+dd(bestMs(h))*10,0)+earned().length*50+S.tx.length*2+S.goals.reduce((s,g)=>s+g.steps.filter(x=>x.d).length*15+(g.status==='выполнена'?100:0),0)}
const lvl=x=>Math.floor(Math.sqrt(x/60))+1;

/* ---- шторка ---- */
function sheet(title,body,onSave,onDel){const o=document.createElement('div');o.className='ov';o.id='ov';
o.innerHTML=`<div class="sh"><h1>${title}</h1>${body}<div class="btns"><button class="btn" id="ok">Сохранить</button><button class="btn s" id="no">Отмена</button>${onDel?'<button class="btn d" id="del">Удалить</button>':''}</div></div>`;
document.body.appendChild(o);const cl=()=>o.remove();o.onclick=e=>{if(e.target===o)cl()};$('#no').onclick=cl;
$('#ok').onclick=()=>{if(onSave()!==false){save();cl();render()}};if(onDel)$('#del').onclick=()=>{onDel();save();cl();render()}}
const F=(l,h)=>`<label>${l}${h}</label>`,opts=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');

/* ---- операции ---- */
function txSheet(id){const t=S.tx.find(x=>x.id===id)||{type:'ex',amt:'',cat:'Еда',date:today(),note:''};
sheet(id?'Операция':'Новая операция',F('Тип',`<select id="t" onchange="$('#c').innerHTML=opts(this.value==='in'?CI:CE)"><option value="ex"${t.type==='ex'?' selected':''}>Расход</option><option value="in"${t.type==='in'?' selected':''}>Доход</option></select>`)+
F('Сумма',`<input id="a" type="number" inputmode="decimal" value="${t.amt}">`)+F('Категория',`<select id="c">${opts(t.type==='in'?CI:CE,t.cat)}</select>`)+F('Дата',`<input id="d" type="date" value="${t.date}">`)+F('Комментарий',`<input id="n" value="${esc(t.note)}">`),
()=>{const a=parseFloat(G('a'));if(!(a>0))return false;const o={id:t.id||uid(),type:G('t'),amt:a,cat:G('c'),date:G('d')||today(),note:G('n')};id?S.tx[S.tx.findIndex(x=>x.id===id)]=o:S.tx.push(o)},id&&(()=>S.tx=S.tx.filter(x=>x.id!==id)))}

const TM=[[7,'Неделя'],[30,'Месяц'],[365,'Год'],[0,'Бесконечно']],termOpts=g=>(TM.some(t=>t[0]===g)?TM:TM.concat([[g,g+' дн']])).map(t=>`<option value="${t[0]}"${t[0]===g?' selected':''}>${t[1]}</option>`).join(''),termName=g=>(TM.find(t=>t[0]===g)||[0,g+' дн'])[1].toLowerCase();
function habSheet(id){const h=S.hab.find(x=>x.id===id)||{name:'',cat:'Здоровье',icon:'🔥',start:Date.now(),goal:30,desc:''};

()=>{if(!G('n'))return false;const o=Object.assign({id:uid(),best:0,resets:[]},h,{name:G('n'),cat:G('c'),icon:G('i')||'🔥',start:new Date(G('d')).getTime()||Date.now(),goal:parseInt(G('g'))||0,desc:G('x')});id?S.hab[S.hab.findIndex(x=>x.id===id)]=o:S.hab.push(o)},id&&(()=>S.hab=S.hab.filter(x=>x.id!==id)))}
const hab=(id,f)=>{const h=S.hab.find(x=>x.id===id);f(h);save();render()};
function boom(x,y,c){c&&c.classList.add('shk');const f=document.createElement('div');f.className='fx';f.style.cssText=`left:${x}px;top:${y}px`;let h='<span class="bm">💥</span>';for(let i=0;i<14;i++)h+=`<span style="--dx:${(Math.random()-.5)*190}px;--dy:${-30-Math.random()*130}px;animation-delay:${Math.random()*.15}s">${i%4?'🔥':'💥'}</span>`;f.innerHTML=h;document.body.appendChild(f);setTimeout(()=>f.remove(),1300)}
function relapse(id,btn){const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div class="sh"><h1>Сорвался?</h1><p class="mu">Счётчик начнётся заново, рекорд сохранится в истории.</p><p><b>'+RL[Math.floor(Math.random()*RL.length)]+'</b></p><div class="btns"><button class="btn d" id="y">Да, сорвался</button><button class="btn s" id="no">Отмена</button></div></div>';document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};$('#no').onclick=()=>o.remove();$('#y').onclick=()=>{const c=btn.closest('.card'),r=c.getBoundingClientRect();o.remove();boom(r.left+r.width/2,r.top+r.height/2,c);setTimeout(()=>hab(id,h=>{h.best=bestMs(h);h.resets.push(Date.now());h.start=Date.now();h.paused=false}),900)}}
const pause=id=>hab(id,h=>{if(h.paused){h.start+=Date.now()-h.pausedAt;h.paused=false}else{h.paused=true;h.pausedAt=Date.now()}});
function finish(id){const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div class="sh"><h1>Ты победил в этом бою?</h1><p class="mu">После ответа привычка будет удалена. Медали за пройденные дни останутся.</p><div class="btns"><button class="btn" id="y">Да</button><button class="btn s" id="n">Нет</button><button class="btn s" id="no">Отмена</button></div></div>';document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};$('#no').onclick=()=>o.remove();const end=()=>{const h=S.hab.find(x=>x.id===id);S.rec=Math.max(S.rec||0,dd(bestMs(h)));S.hab=S.hab.filter(x=>x.id!==id);save();o.remove();render()};$('#y').onclick=end;$('#n').onclick=end}
function habCard(h){const ms=el(h),d=dd(ms),p=h.goal?Math.min(100,d/h.goal*100):0,last=h.resets.length?new Date(h.resets[h.resets.length-1]).toLocaleDateString('ru-RU'):'не срывался';
return `<div class="card ${h.done?'dn':''}"><div class="row"><span class="ic">${esc(h.icon)}</span><div class="g"><b>${esc(h.name)}</b><br><small>${esc(h.cat)}${h.paused?', на паузе':''}${h.done?', завершено':''}</small></div><button class="btn s sm" onclick="habSheet(${h.id})">Изменить</button></div>

<small>Личный рекорд: ${dd(bestMs(h))} дн. Срывов: ${h.resets.length}. Последний сброс: ${last}.</small>

function fin(){const L=S.tx.filter(t=>inP(t,per)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),i=sum(L,'in'),e=sum(L,'ex'),cats={};
