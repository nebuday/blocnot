<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Копилка</title>
<style>
:root{--bg:#ececeb;--card:#f6f6f5;--line:#d9d9d7;--text:#2b2b2a;--mute:#85857f;--acc:#3a3a38;--accT:#f6f6f5;--inc:#4f6b58;--exp:#8a5a54;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1b;--card:#262625;--line:#3a3a38;--text:#e8e8e6;--mute:#8e8e88;--acc:#e8e8e6;--accT:#1c1c1b;--inc:#8fb09a;--exp:#c9928b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1b;--card:#262625;--line:#3a3a38;--text:#e8e8e6;--mute:#8e8e88;--acc:#e8e8e6;--accT:#1c1c1b;--inc:#8fb09a;--exp:#c9928b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.02em}
button,input{font:inherit;color:inherit}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.big{font-size:36px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px}.row>*{flex:1}
.sm{font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line)}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;min-width:0}
input:focus{outline:2px solid var(--mute);outline-offset:-1px}
.main{width:100%;background:var(--acc);color:var(--accT);border:0;border-radius:10px;padding:12px;cursor:pointer;font-weight:600}
.cancel{width:100%;margin-top:8px;display:none}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.bar input{margin:0;flex:1}
.day{font-size:12px;color:var(--mute);margin:16px 4px 6px;text-transform:uppercase;letter-spacing:.06em}
.op{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.op .i{flex:1;min-width:0}.op .s{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .n{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .a{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.del{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:0 4px}
.empty{text-align:center;color:var(--mute);padding:20px 0}
.donut{position:relative;width:210px;max-width:70%;margin:4px auto 14px}.donut svg{width:100%;display:block}
.trk,.arc{fill:none;stroke-width:10}.trk{stroke:var(--line)}.arc{transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dasharray .4s,stroke-dashoffset .4s}
#arcI{stroke:var(--inc)}#arcE{stroke:var(--exp)}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.big2{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.leg>div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.leg b{font-weight:600}
.icons{display:none;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ib{width:40px;height:40px;font-size:20px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;padding:0}
.ib.on{border-color:var(--text);background:var(--card);box-shadow:0 0 0 1px var(--text)}
.ic{font-size:22px;width:30px;text-align:center}
.hl{margin:0 0 4px 2px}.card .day:first-of-type{margin-top:8px}
</style>
</head>
<body>
<main>
<header><h1>Копилка</h1><button class="ghost" id="theme" title="Тема">◐</button></header>

<div class="bar">
<button class="ghost" id="prev">‹</button>
<input type="month" id="month">
<button class="ghost" id="next">›</button>
<button class="ghost" id="all">Всё</button>
</div>
<div class="card">
<div class="donut"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="48"/><circle class="arc" id="arcI" cx="60" cy="60" r="48" stroke-dasharray="0 301.59"/><circle class="arc" id="arcE" cx="60" cy="60" r="48" stroke-dasharray="0 301.59"/></svg>
<div class="mid"><div class="lbl" id="pl">Итого</div><div class="big2" id="bal">0</div></div></div>
<div class="leg"><div><span>Доходы</span><b class="inc" id="sInc">0</b></div><div><span>Расходы</span><b class="exp" id="sExp">0</b></div><div><span>Всего в копилке</span><b id="total">0</b></div></div>
</div>

<div class="card">
<div class="seg"><button data-t="in" class="on">Доход</button><button data-t="out">Расход</button></div>
<div class="icons" id="icons"></div>
<input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма">
<input id="source" list="srcs" placeholder="Откуда / на что (например, зарплата, еда)">
<datalist id="srcs"></datalist>
<input id="date" type="date">
<input id="note" placeholder="Заметка (необязательно)">
<button class="main" id="save">Добавить</button>
<button class="ghost cancel" id="cancel">Отменить редактирование</button>
</div>

<div class="card"><div class="lbl hl">История доходов</div><div id="listIn"></div></div>
<div class="card"><div class="lbl hl">История расходов</div><div id="listOut"></div></div>
</main>
<script>
const K='kopilka-v1';let ops=[],type='in',icon='🛒',editId=null,period=null;const ICONS=['🛒','🍔','☕','🚌','🏠','💡','👕','💊','🎬','🎁','📱','🐾','✈️','🎓','🔧','💳'];
const $=id=>document.getElementById(id);
try{ops=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){ops=[]}
function persist(){try{localStorage.setItem(K,JSON.stringify(ops))}catch(e){}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=n=>n.toLocaleString('ru-RU',{maximumFractionDigits:2});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
period=today().slice(0,7);$('month').value=period;$('date').value=today();

document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setType(b.dataset.t));
function setType(t){type=t;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));renderIcons()}
function renderIcons(){const b=$('icons');b.style.display=type==='out'?'flex':'none';b.innerHTML=ICONS.map(i=>'<button type="button" class="ib'+(i===icon?' on':'')+'" data-i="'+i+'">'+i+'</button>').join('')}
$('icons').onclick=e=>{const b=e.target.closest('[data-i]');if(b){icon=b.dataset.i;renderIcons()}};
$('source').oninput=()=>{if(type!=='out')return;const m=[...ops].reverse().find(o=>o.type==='out'&&o.icon&&o.source===$('source').value.trim());if(m){icon=m.icon;renderIcons()}};

$('save').onclick=()=>{
 const amount=parseFloat($('amount').value),source=$('source').value.trim(),date=$('date').value;
 if(!(amount>0)){$('amount').focus();return}
 if(!date){$('date').focus();return}
 const o={id:editId||Date.now()+''+Math.random().toString(36).slice(2,6),type,amount,icon:type==='in'?'💵':icon,source:source||'Без названия',date,note:$('note').value.trim()};
 if(editId)ops=ops.map(x=>x.id===editId?o:x);else ops.push(o);
 persist();resetForm();render();
};
function resetForm(){editId=null;$('amount').value='';$('source').value='';$('note').value='';$('date').value=today();$('save').textContent='Добавить';$('cancel').style.display='none'}
$('cancel').onclick=resetForm;

$('month').onchange=()=>{period=$('month').value||null;render()};
$('all').onclick=()=>{period=null;$('month').value='';render()};
function shift(d){const base=period||today().slice(0,7);let[y,m]=base.split('-').map(Number);m+=d;if(m>12){m=1;y++}if(m<1){m=12;y--}period=y+'-'+String(m).padStart(2,'0');$('month').value=period;render()}
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);

$('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};

function render(){
 const sum=a=>a.reduce((s,o)=>s+(o.type==='in'?o.amount:-o.amount),0);
 $('total').textContent=fmt(sum(ops));
 const v=ops.filter(o=>!period||o.date.startsWith(period)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
 const I=v.filter(o=>o.type==='in').reduce((s,o)=>s+o.amount,0),E=v.filter(o=>o.type==='out').reduce((s,o)=>s+o.amount,0),C=301.59,T=I+E,li=T?I/T*C:0,le=T?E/T*C:0;
 $('sInc').textContent=fmt(I);$('sExp').textContent=fmt(E);$('bal').textContent=(I-E>0?'+':'')+fmt(I-E);
 $('arcI').setAttribute('stroke-dasharray',li+' '+(C-li));$('arcE').setAttribute('stroke-dasharray',le+' '+(C-le));$('arcE').setAttribute('stroke-dashoffset',-li);
 $('pl').textContent=period?new Date(period+'-01T00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'}):'За всё время';
 $('srcs').innerHTML=[...new Set(ops.filter(o=>o.type===type).map(o=>o.source))].map(s=>'<option value="'+esc(s)+'">').join('');
 renderList('In',v.filter(o=>o.type==='in'));renderList('Out',v.filter(o=>o.type==='out'));
}
function renderList(k,v){
 if(!v.length){$('list'+k).innerHTML='<div class="empty">Пока пусто</div>';return}
 let h='',last='';
 v.forEach(o=>{
  if(o.date!==last){last=o.date;h+='<div class="day">'+new Date(o.date+'T00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+'</div>'}
  h+='<div class="op" data-id="'+o.id+'"><div class="ic">'+(o.icon||(o.type==='in'?'💵':'🛒'))+'</div><div class="i"><div class="s">'+esc(o.source)+'</div>'+(o.note?'<div class="n">'+esc(o.note)+'</div>':'')+'</div><div class="a '+(o.type==='in'?'inc':'exp')+'">'+(o.type==='in'?'+':'−')+fmt(o.amount)+'</div><button class="del" data-del="'+o.id+'" title="Удалить">×</button></div>';
 });
 $('list'+k).innerHTML=h;
}
$('listIn').onclick=$('listOut').onclick=e=>{
 const d=e.target.closest('[data-del]');
 if(d){if(confirm('Удалить операцию?')){ops=ops.filter(o=>o.id!==d.dataset.del);persist();if(editId===d.dataset.del)resetForm();render()}return}
 const r=e.target.closest('.op');if(!r)return;
 const o=ops.find(x=>x.id===r.dataset.id);if(!o)return;
 editId=o.id;icon=o.icon||'🛒';setType(o.type);$('amount').value=o.amount;$('source').value=o.source;$('date').value=o.date;$('note').value=o.note||'';
 $('save').textContent='Сохранить изменения';$('cancel').style.display='block';scrollTo({top:0,behavior:'smooth'});
};
render();
</script>
</body>
</html>
